<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Application submission</title></head>
<body>
<!-- Keep this static form schema in sync with the application in index.html. -->
<form name="fnatic-recruitment" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="fnatic-recruitment">
<input name="bot-field" tabindex="-1" autocomplete="off">
<input type="hidden" name="goal">
<input type="hidden" name="main_lane">
<input type="hidden" name="application_type">
<input type="hidden" name="squad_size">
<select name="player1_lane"><option>EXP Lane</option><option>Jungler</option><option>Mid Lane</option><option>Gold Lane</option><option>Roamer</option></select>
<input name="player1_ign" autocomplete="off" placeholder="e.g. WolfRider">
<input name="player1_character_id" inputmode="numeric" autocomplete="off" placeholder="e.g. 123456789">
<input name="player1_server_id" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="e.g. 2345">
<input name="player1_highest_star" autocomplete="off" placeholder="e.g. Mythic 45 stars">
<input name="player1_discord" autocomplete="off" placeholder="e.g. wolfrider#0 or @wolfrider">
<select name="player2_lane"><option>EXP Lane</option><option>Jungler</option><option>Mid Lane</option><option>Gold Lane</option><option>Roamer</option></select>
<input name="player2_ign" autocomplete="off" placeholder="e.g. WolfRider">
<input name="player2_character_id" inputmode="numeric" autocomplete="off" placeholder="e.g. 123456789">
<input name="player2_server_id" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="e.g. 2345">
<input name="player2_highest_star" autocomplete="off" placeholder="e.g. Mythic 45 stars">
<input name="player2_discord" autocomplete="off" placeholder="e.g. wolfrider#0 or @wolfrider">
<select name="player3_lane"><option>EXP Lane</option><option>Jungler</option><option>Mid Lane</option><option>Gold Lane</option><option>Roamer</option></select>
<input name="player3_ign" autocomplete="off" placeholder="e.g. WolfRider">
<input name="player3_character_id" inputmode="numeric" autocomplete="off" placeholder="e.g. 123456789">
<input name="player3_server_id" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="e.g. 2345">
<input name="player3_highest_star" autocomplete="off" placeholder="e.g. Mythic 45 stars">
<input name="player3_discord" autocomplete="off" placeholder="e.g. wolfrider#0 or @wolfrider">
<select name="player4_lane"><option>EXP Lane</option><option>Jungler</option><option>Mid Lane</option><option>Gold Lane</option><option>Roamer</option></select>
<input name="player4_ign" autocomplete="off" placeholder="e.g. WolfRider">
<input name="player4_character_id" inputmode="numeric" autocomplete="off" placeholder="e.g. 123456789">
<input name="player4_server_id" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="e.g. 2345">
<input name="player4_highest_star" autocomplete="off" placeholder="e.g. Mythic 45 stars">
<input name="player4_discord" autocomplete="off" placeholder="e.g. wolfrider#0 or @wolfrider">
<select name="player5_lane"><option>EXP Lane</option><option>Jungler</option><option>Mid Lane</option><option>Gold Lane</option><option>Roamer</option></select>
<input name="player5_ign" autocomplete="off" placeholder="e.g. WolfRider">
<input name="player5_character_id" inputmode="numeric" autocomplete="off" placeholder="e.g. 123456789">
<input name="player5_server_id" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="e.g. 2345">
<input name="player5_highest_star" autocomplete="off" placeholder="e.g. Mythic 45 stars">
<input name="player5_discord" autocomplete="off" placeholder="e.g. wolfrider#0 or @wolfrider">
<input name="full_name" autocomplete="name" placeholder="Your real name">
<select name="position"><option value="">Pick a position</option><option>Coach</option><option>Manager</option><option>Analyst</option><option>Content Creator</option></select>
<input name="discord_handle" autocomplete="off" placeholder="e.g. wolfrider#0 or @wolfrider">
<textarea name="past_experience" placeholder="Write it here..."></textarea>
</form>
</body>
</html>
